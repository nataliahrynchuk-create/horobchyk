<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Ретро-тамагочі для задач. Виконуй справи, годуй пташку й дивись, як вона росте від яйця до дорослого горобця.">
<meta name="theme-color" content="#2a68e0">
<meta property="og:title" content="Горобчик — ретро-тамагочі для задач">
<meta property="og:description" content="Виконуй задачі, годуй Горобчика й дивись, як він росте.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐦</text></svg>">
<title>Горобчик — тамагочі для задач</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf2ff;--fg:#0f2347;--mut:#4d6690;--card:#ffffff;--line:#c5d8f5;--acc:#2563d6;--accfg:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c1626;--fg:#e6eefc;--mut:#93a9cc;--card:#13233b;--line:#27415f;--acc:#5b9dff;--accfg:#07172e}}
:root[data-theme="dark"]{--bg:#0c1626;--fg:#e6eefc;--mut:#93a9cc;--card:#13233b;--line:#27415f;--acc:#5b9dff;--accfg:#07172e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45}
.app{max-width:920px;margin:0 auto;padding:28px 18px 40px;display:grid;grid-template-columns:340px 1fr;gap:44px;align-items:center;min-height:100vh}
@media(max-width:780px){.app{grid-template-columns:1fr;gap:34px;min-height:0}}

/* device */
.dev{isolation:isolate;position:relative;padding-top:30px}
.loop{position:absolute;top:0;left:50%;width:50px;height:50px;margin-left:-25px;border:7px solid #cfd8e6;border-radius:50%;box-shadow:inset 0 2px 3px #fff,0 2px 5px rgba(0,0,0,.35);z-index:-1}
.shell{position:relative;width:min(320px,100%);margin:0 auto;padding:56px 34px 40px;border-radius:48% 48% 47% 47%/40% 40% 60% 60%;background:linear-gradient(160deg,#4f9bff 0%,#2a68e0 55%,#1a43ad 100%);box-shadow:inset 0 -16px 24px rgba(6,22,90,.5),inset 0 10px 16px rgba(255,255,255,.3),0 24px 36px rgba(10,30,100,.38),0 0 0 3px #15368a}
.shell::before{content:"";position:absolute;left:12%;top:5%;width:44%;height:16%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));transform:rotate(-14deg);pointer-events:none}
.brand{min-height:8px;font:8px 'Press Start 2P',monospace;color:#e9f1ff;text-align:center;margin:0 0 12px;text-shadow:0 1px 0 #15368a,0 -1px 0 rgba(255,255,255,.25)}
.bezel{background:#101a33;border-radius:22px;padding:12px;box-shadow:inset 0 3px 8px #000,0 2px 0 rgba(255,255,255,.4)}
.screen{position:relative;height:204px;background:#b7c7ad;border-radius:9px;overflow:hidden;box-shadow:inset 3px 3px 7px rgba(20,40,20,.45)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(25,45,20,.07) 2px 3px),repeating-linear-gradient(90deg,transparent 0 2px,rgba(25,45,20,.06) 2px 3px)}
.px{font:7px/1 'Press Start 2P',monospace;color:#1f2a22;text-shadow:1px 1px 0 rgba(30,50,25,.2)}
.hud{position:absolute;left:9px;right:9px;top:9px;display:flex;align-items:center;gap:6px}
.meter{display:flex;gap:2px;flex:1}
.meter i{flex:1;max-width:14px;height:9px;border:1px solid #1f2a22;opacity:.4}
.meter i.on{background:#1f2a22;opacity:1}
.cnt{margin-left:auto}
.lvl{position:absolute;left:9px;bottom:8px}
.say{position:absolute;top:30px;left:50%;transform:translateX(-50%);border:2px solid #1f2a22;padding:4px 6px;background:#b7c7ad;white-space:nowrap;display:none;z-index:2}
.say.show{display:block}
.floor{position:absolute;left:8px;right:8px;bottom:26px;border-top:3px dotted #1f2a22;opacity:.55}
#mv{position:absolute;left:50%;bottom:28px;width:140px;margin-left:-70px}
#mv.playing{animation:roam 2.4s steps(12) 2}
@keyframes roam{0%{transform:translateX(-36px) scaleX(1)}49%{transform:translateX(36px) scaleX(1)}50%{transform:translateX(36px) scaleX(-1)}99%{transform:translateX(-36px) scaleX(-1)}100%{transform:translateX(-36px) scaleX(1)}}
#grow{position:relative;transform-origin:50% 100%}
#spr{display:block;width:140px;height:105px;shape-rendering:crispEdges;filter:drop-shadow(2px 2px 0 rgba(30,50,25,.22));animation:bob 1.1s steps(2) infinite}
#sp{fill:#1f2a22}
#art{display:none}
.screen.color{background:#f4f0e2}
.screen.color::after{display:none}
.screen.color #spr{filter:none}
.screen.color #sp{display:none}
.screen.color #art{display:block}
.screen.color .say{background:#f4f0e2}
#spr.chew{animation:chewA .25s steps(2) infinite}
@keyframes chewA{50%{transform:translateY(2px) scaleY(.97)}}
.skins{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.skin{font:inherit;font-weight:700;font-size:12px;padding:5px 9px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.skin[aria-pressed='true']{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.skin:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@keyframes bob{50%{transform:translateY(-3px)}}
#mv.playing #spr{animation:hop .3s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-12px)}}
#target{position:absolute;left:92%;top:37%;width:2px;height:2px}
.ball{position:absolute;left:26px;bottom:30px;width:14px;height:14px;background:#1f2a22;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);display:none;animation:hop .5s steps(3) infinite}
.ball.on{display:block}
#mv{transform-origin:50% 100%}
.sign{position:absolute;left:50%;bottom:28px;width:70px;height:136px;margin-left:-35px;display:none;z-index:3;pointer-events:none}
.screen.protest .sign{display:block;animation:signx 3.6s steps(18) infinite}
@keyframes signx{0%{transform:translateX(-36px)}49%{transform:translateX(36px)}50%{transform:translateX(36px)}99%{transform:translateX(-36px)}100%{transform:translateX(-36px)}}
.sign .board{position:absolute;left:0;top:0;width:70px;height:26px;background:#f4f0e2;border:3px solid #1f2a22;font:7px/20px 'Press Start 2P',monospace;color:#1f2a22;text-align:center;animation:raise .6s steps(2) infinite}
.sign i{position:absolute;left:33px;top:26px;width:4px;height:70px;background:#6b4a2a;animation:stk .6s steps(2) infinite}
@keyframes raise{50%{transform:translateY(-8px)}}
@keyframes stk{50%{top:18px;height:78px}}
#mv.protest{animation:roam 3.6s steps(18) infinite}
#mv.joy{animation:joy .3s steps(2) 5}
@keyframes joy{50%{transform:translateY(-14px) rotate(-6deg)}}
#mv.tk{animation:tk .94s steps(1) infinite}
@keyframes tk{0%{transform:translateX(-20px) rotate(-8deg) scaleX(1)}12.5%{transform:translate(-20px,-14px) rotate(8deg) scaleX(1)}25%{transform:translateX(0) rotate(0deg) scaleX(-1)}37.5%{transform:translate(20px,-10px) rotate(10deg) scaleX(-1)}50%{transform:translateX(20px) rotate(-10deg) scaleX(1)}62.5%{transform:translate(6px,-18px) rotate(-6deg) scaleX(1)}75%{transform:translateX(-10px) rotate(12deg) scaleX(-1)}87.5%{transform:translate(-4px,-8px) rotate(-12deg) scaleX(-1)}}
#mv.tk #spr{animation:kick .235s steps(1) infinite}
@keyframes kick{0%{transform:skewX(-8deg) scaleY(1)}50%{transform:skewX(8deg) scaleY(.92)}}
.wing{position:absolute;width:36px;height:20px;background:#1f2a22;display:none;z-index:3;pointer-events:none}
#grow.dance .wing{display:block}
.wing.l{left:-4px;top:54px;transform-origin:100% 50%;clip-path:polygon(100% 40%,70% 0,0 10%,15% 45%,0 80%,60% 100%,100% 70%);animation:wl .47s steps(1) infinite}
.wing.r{left:104px;top:60px;transform-origin:0 50%;clip-path:polygon(0 40%,30% 0,100% 10%,85% 45%,100% 80%,40% 100%,0 70%);animation:wr .47s steps(1) infinite}
@keyframes wl{0%{transform:rotate(-65deg)}25%{transform:rotate(25deg)}50%{transform:rotate(-30deg)}75%{transform:rotate(70deg)}}
@keyframes wr{0%{transform:rotate(-60deg)}25%{transform:rotate(30deg)}50%{transform:rotate(-35deg)}75%{transform:rotate(70deg)}}
.screen.color .wing{background:#a8743d}
.screen.strobe{animation:strobe .47s steps(1) infinite}
@keyframes strobe{50%{filter:invert(.8)}}
#mv.fall{animation:roam 1.8s steps(9) 3}
#mv.fly{animation:fly 2.6s steps(13) 2}
@keyframes fly{0%{transform:translate(0,0) scaleX(1)}20%{transform:translate(30px,-44px) scaleX(1)}45%{transform:translate(40px,-26px) scaleX(1)}50%{transform:translate(40px,-26px) scaleX(-1)}75%{transform:translate(-30px,-46px) scaleX(-1)}99%{transform:translate(0,0) scaleX(-1)}100%{transform:translate(0,0) scaleX(1)}}
#mv.sing #spr{animation:hop .6s steps(2) infinite}
.seed{position:absolute;top:24px;width:6px;height:6px;background:#1f2a22;animation:drop .9s steps(7) forwards;z-index:1}
@keyframes drop{to{transform:translateY(140px)}}
.cloud{position:absolute;left:0;height:8px;background:#1f2a22;opacity:.3;animation:cloud 3.2s linear infinite}
@keyframes cloud{from{transform:translateX(250px)}to{transform:translateX(-60px)}}
.eq{position:absolute;bottom:8px;width:8px;height:4px;background:#1f2a22;animation:eq .47s steps(4) infinite alternate}
@keyframes eq{to{height:22px}}
.hrt{position:absolute;font:12px 'Press Start 2P',monospace;color:#1f2a22;animation:up 1.3s ease-out forwards;pointer-events:none}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}
.btns{display:flex;justify-content:center;align-items:flex-start;gap:16px;margin-top:18px}
.btns div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#f1f6ff;text-shadow:0 1px 0 #15368a}
.btns div:nth-child(2){margin-top:12px}
.btn{width:38px;height:38px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff6b8,#f2c13e 70%);box-shadow:0 4px 0 #9b6f0c,0 7px 9px rgba(5,20,80,.45);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9b6f0c}
.btn:focus-visible,.chk:focus-visible,.del:focus-visible,.add:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* tasks */
h1{font-size:30px;line-height:1.1;margin:0 0 6px;font-weight:800}
.sub{margin:0 0 20px;color:var(--mut);font-size:11.5px;white-space:nowrap}
@media(max-width:780px){.sub{white-space:normal}}
.rst{font:inherit;font-weight:700;font-size:12px;padding:5px 9px;border-radius:8px;border:2px dashed var(--line);background:transparent;color:var(--mut);cursor:pointer}
.rst.arm{border-color:#d64545;color:#d64545}
.rst:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
.add{font:inherit;font-weight:800;padding:0 18px;border:0;border-radius:12px;background:var(--acc);color:var(--accfg);cursor:pointer}
ul{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border:2px solid var(--line);border-radius:12px}
li span{flex:1;overflow-wrap:anywhere}
li.done span{text-decoration:line-through;color:var(--mut)}
.chk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--acc);background:transparent;color:var(--accfg);font-size:18px;font-weight:800;cursor:pointer;line-height:1}
.chk[aria-checked="true"]{background:var(--acc)}
.chk[aria-checked="true"]::after{content:"✓"}
.del{flex:none;border:0;background:transparent;color:var(--mut);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px}
.empty{margin:16px 0 0;padding:18px;border:2px dashed var(--line);border-radius:12px;color:var(--mut)}
.stats{margin:18px 0 0;color:var(--mut);font-size:14px}
.fly{position:fixed;left:0;top:0;font-size:28px;line-height:1;pointer-events:none;z-index:50}
@media (prefers-reduced-motion: reduce){#spr,#mv,#mv *,.sign,.sign *,.ball,.cloud,.seed,.eq,.screen.strobe{animation:none!important}}
</style>
</head>
<body>
<main class="app">
  <section class="dev" aria-label="Горобчик">
    <div class="loop"></div>
    <div class="shell">
      <div class='brand' aria-hidden='true'></div>
      <div class="bezel">
        <div class="screen" id="screen">
          <div class="hud px"><span>ЇЖА</span><div class="meter" id="meter" aria-label="Ситість"></div><span class="cnt" id="cnt">0/0</span></div>
          <div class="say px" id="say"></div>
          <div class="floor"></div>
          <div class="ball" id="ball"></div>
          <div id="mv"><div id="grow">
            <svg id='spr' viewBox='0 0 20 15' aria-hidden='true'><path id='sp' d=''/><g id='art'></g></svg>
            <i id='target'></i><i class='wing l'></i><i class='wing r'></i>
          </div></div>
          <div class='sign'><div class='board'>ПРАЦЮЙ!</div><i></i></div>
          <div class="lvl px" id="lvl"></div>
        </div>
      </div>
      <div class="btns">
        <div><button class="btn" id="bPet" aria-label="Погладити"></button>Погладити</div>
        <div><button class="btn" id="bPlay" aria-label="Погратись"></button>Погратись</div>
        <div><button class="btn" id="bSnd" aria-label="Звук"></button><span id="sndL">Звук</span></div>
      </div>
    </div>
  </section>

  <section>
    <h1>Що з’їсть Горобчик сьогодні?</h1>
    <p class="sub">Додай задачі на день. Коли відмітиш виконану, вона полетить до Горобчика як зерня.</p>
    <div class="row">
      <input id="in" type="text" maxlength="120" placeholder="Нова задача" aria-label="Нова задача" autocomplete="off">
      <button class="add" id="add">Додати</button>
    </div>
    <ul id="list"></ul>
    <p class="empty" id="empty">Поки порожньо. Додай першу задачу, і Горобчик отримає що клювати.</p>
    <p class='stats' style='margin:22px 0 8px'>Вигляд Горобчика</p>
    <div class='skins' role='group' aria-label='Вигляд Горобчика'><button class='skin' data-skin='outline'>Піксель-контур</button><button class='skin' data-skin='art'>Малюнок</button></div>
    <div style='margin-top:14px'><button class='rst' id='bReset'>Повернути до яйця</button></div>
  </section>
</main>
<script>
(function(){
const $=s=>document.querySelector(s);
const KEY='horobchyk-v1',FOODS=['🌾','🌻','🍞','🍇','🌽','🍎'],STAGES=['Яйце','Вилуплюється','Пташеня','Ціплятко','Підліток','Дорослий'],STEP=[4,14,34,60,100],BK=[[10,8],[14,8],[16,8],[17,8],[17,4],[18,5]];
const ROWS=[
"....................",
"............####....",
"...........######...",
"..........########..",
"..........###o####..",
".........###########",
"........######ooo##.",
".....#############..",
"....###ooooo######..",
"...##oooooooo#o#o#..",
"..###ooooo#######...",
"#####..#########....",
"######..#######.....",
".####....#..#.......",
"..##....##.##......."];
const today=()=>new Date().toISOString().slice(0,10);
let S={tasks:[],fed:0,dn:0,day:today(),snd:true,skin:'outline'};
try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
if(S.skin!=='art')S.skin='outline';if(!S.lastFed)S.lastFed=Date.now();
{const stale=S.tasks.filter(t=>t.done);if(stale.length){S.tasks=S.tasks.filter(t=>!t.done);S.dn=(S.dn||0)+stale.length}}
if(S.day!==today()){S.day=today();S.dn=0;S.lastFed=Date.now();S.tasks.forEach(t=>t.fed=false)}
let temp=null,open=false,pending=0,sayT=null,AC=null,MG=null,tmr=null,gameEnd=null,qd=false;const PROT=900000;

const out=()=>{if(!MG){MG=AC.createGain();MG.connect(AC.destination)}return MG};
function stopAudio(){try{if(MG){MG.disconnect();MG=null}}catch(e){}}
function beep(seq){
  if(!S.snd)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
    seq.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;
      g.gain.setValueAtTime(.04,t+i*.1);g.gain.setValueAtTime(.0001,t+i*.1+.09);o.connect(g);g.connect(out());o.start(t+i*.1);o.stop(t+i*.1+.1)})
  }catch(e){}
}
function sprite(m,st){
  if(st<5)return sprite2(m,st);
  const g=ROWS.map(r=>r.split('')),set=(x,y,c)=>{g[y][x]=c};
  if(m==='happy'){set(13,4,'#');set(13,3,'o');set(12,4,'o');set(14,4,'o')}
  if(m==='open'){set(18,4,'#');set(19,4,'#');set(18,5,'.');set(19,5,'.')}
  if(m==='hungry'){set(13,5,'o');set(13,6,'o')}
  let d='';
  g.forEach((r,y)=>{let x=0;while(x<r.length){if(r[x]==='#'){const s=x;while(r[x]==='#')x++;d+='M'+s+' '+y+'h'+(x-s)+'v1h-'+(x-s)+'z'}else x++}});
  $('#sp').setAttribute('d',d);
}
function sprite2(m,st){
  const W=20,H=15,g=Array.from({length:H},()=>Array(W).fill('.'));
  const set=(x,y,c)=>{if(x>=0&&x<W&&y>=0&&y<H)g[y][x]=c};
  const ell=(cx,cy,rx,ry,c)=>{for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(((x-cx)/rx)**2+((y-cy)/ry)**2<=1)set(x,y,c||'#')};
  const pts=a=>a.forEach(p=>set(p[0],p[1],'#'));
  const inEgg=(x,y)=>((x-10)/4.6)**2+((y-9)/5.6)**2<=1||((x-10)/3.4)**2+((y-6.5)/3.6)**2<=1;
  const legs=(a,b)=>{set(a,13,'#');set(b,13,'#');[a-1,a,a+1,b-1,b,b+1].forEach(x=>set(x,14,'#'))};
  let eye=null,bk=null;
  if(st===0){for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(inEgg(x,y))set(x,y,'#');[[9,6],[12,9],[8,11],[11,12]].forEach(p=>set(p[0],p[1],'o'))}
  if(st===1){
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(inEgg(x,y)){if(y<=6)set(x+1,y-2,'#');else if(y>=12||(y===11&&x%2))set(x,y,'#')}
    ell(10,8,3.4,2.2);set(11,8,'o');eye=[11,8];bk=[14,8];pts([[14,8],[15,8],[14,9]]);set(10,3,'o');
  }
  if(st===2){ell(10,8.5,5.2,4.3);pts([[10,3],[11,3],[10,4]]);ell(8.5,9.5,2.6,1.3,'o');legs(8,12);set(12,7,'o');eye=[12,7];bk=[16,8];pts([[16,8],[17,8],[16,9]])}
  if(st===3){ell(10,8,6,4.6);pts([[10,2],[9,3],[10,3],[11,3],[3,8],[2,8],[1,8],[2,7]]);ell(8.5,9,3.2,1.8,'o');legs(8,12);set(13,6,'o');eye=[13,6];bk=[17,8];pts([[17,8],[18,8],[17,9]])}
  if(st===4){ell(9,8.2,6.4,4.2);ell(13.2,4.4,3.3,3);pts([[2,8],[2,9],[1,9],[1,10],[0,10],[0,11],[1,11],[2,10]]);ell(8,8.5,3.4,1.6,'o');set(14,5,'o');set(15,5,'o');legs(7,11);set(14,3,'o');eye=[14,3];bk=[17,4];pts([[17,4],[18,4],[17,5]])}
  if(eye){const ex=eye[0],ey=eye[1];
    if(m==='happy'){set(ex,ey,'#');set(ex-1,ey,'o');set(ex+1,ey,'o');set(ex,ey-1,'o')}
    if(m==='hungry'){set(ex,ey+1,'o');set(ex,ey+2,'o')}
